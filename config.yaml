_config_version: 49
model:
  provider: custom
  base_url: https://omniroute.unnichat.com.br/v1
  # Formato nativo da Anthropic (/v1/messages), o mesmo que o Claude Code usa: thinking de verdade,
  # cache de prompt e max_tokens altos. Provado no call-log em 05/11 (Chief).
  api_mode: anthropic_messages
  default: unnisend/sonnet
  key_env: UNNISEND_OMNIROUTE_KEY
custom_providers:
- name: OmniRoute UnniSend
  base_url: https://omniroute.unnichat.com.br/v1
  api_mode: anthropic_messages
  key_env: UNNISEND_OMNIROUTE_KEY
  model: unnisend/sonnet
  # prompt_caching: o Hermes so liga o cache de prompt sozinho quando o nome do modelo tem 'claude'; os apelidos
  # unnisend/*, copy/* e designer/* ficariam sem cache (pagando o prompt inteiro a cada turno). Provado 05/11:
  # com a marca, o 2o turno leu 44 mil tokens do cache. auto/best-vision fica sem (nao e Claude garantido).
  models:
    unnisend/sonnet: {prompt_caching: true}
    unnisend/opus: {prompt_caching: true}
    unnisend/haiku: {prompt_caching: true}
    claude/claude-sonnet-5-5: {prompt_caching: true}
    claude/claude-opus-5-5: {prompt_caching: true}
    claude/claude-haiku-5-5: {prompt_caching: true}
    claude/claude-sonnet-5: {prompt_caching: true}
    claude/claude-opus-5: {prompt_caching: true}
    claude/claude-sonnet-4-6: {prompt_caching: true}
    claude/claude-haiku-4-5-20251001: {prompt_caching: true}
    copy/melhor: {prompt_caching: true}
    copy/economico: {prompt_caching: true}
    designer/melhor: {prompt_caching: true}
    designer/economico: {prompt_caching: true}
    auto/best-vision: {}
auxiliary:
  vision:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: auto/best-vision
  compression:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: unnisend/haiku
  title_generation:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: unnisend/haiku
    language: pt-BR
agent:
  language: pt-BR
  # Esforço de raciocínio alto, como o Claude Code manda (output_config.effort high). Custa mais tokens de
  # saída em tarefa difícil; em pergunta simples o modelo pensa pouco mesmo assim.
  reasoning_effort: high
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: hindsight
telemetry:
  shared_metrics:
    enabled: false
    send: false
onboarding:
  seen:
    openclaw_residue_cleanup: true
plugins:
  enabled:
  - hindsight
  - unnisend_atualiza
  - unnisend_agentes
  - unnisend_torriani
  disabled: []
skills:
  # Comandos do kit do Torriani: pasta montada por scripts/torriani.sh (links para as skills do negócio escolhido).
  external_dirs:
  - torriani-skills
terminal:
  # Kit do Torriani (imagem): a chave do OpenRouter viaja da shell que abriu o kit com o nome neutro
  # UNNISEND_IMAGEM_OR (nomes com KEY/TOKEN não atravessam para o gateway) e o shell-init do perfil
  # a traduz para OPENROUTER_API_KEY só dentro dos comandos de terminal da sessão.
  client_env_passthrough:
    - UNNISEND_IMAGEM_OR
  shell_init_files:
    - ~/.hermes/profiles/unnisend/scripts/shell-init.sh
    - ${LOCALAPPDATA}/hermes/profiles/unnisend/scripts/shell-init.sh
    - ~/.profile
    - ~/.bash_profile
    - ~/.bashrc
quick_commands:
  copy-melhor:
    type: alias
    target: /model copy/melhor
    description: 'Copy: o melhor modelo (Opus 5.5)'
  copy-eco:
    type: alias
    target: /model copy/economico
    description: 'Copy: custo-benefício (Sonnet 5.5)'
  designer-melhor:
    type: alias
    target: /model designer/melhor
    description: 'Design: o melhor modelo (Opus 5.5)'
  designer-eco:
    type: alias
    target: /model designer/economico
    description: 'Design: custo-benefício (Sonnet 5.5)'

# Tela: modo foco por padrão (só pedido e resposta; /focus off mostra o andamento das ferramentas).
# A escolha da pessoa é preservada pelo plugin unnisend_atualiza quando o perfil atualiza.
display:
  focus_view: true
  skin: unnisend
