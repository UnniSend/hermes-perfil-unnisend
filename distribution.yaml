name: unnisend
version: 0.2.0
description: "Assistente de trabalho da UnniSend: Hermes no computador do membro, IA pelo OmniRoute central da empresa"
hermes_requires: ">=0.21.0"
author: "UnniSend"
license: "Proprietary"

# A chave é individual, criada pelo admin no OmniRoute da empresa e entregue a cada pessoa.
env_requires:
  - name: UNNISEND_OMNIROUTE_KEY
    description: "Sua chave pessoal do OmniRoute da UnniSend (peça ao Israel). Começa com sk-"
    required: true

# Arquivos que o perfil entrega e atualiza (o resto, como .env, plugins instalados e conversas, e da pessoa).
distribution_owned:
  - SOUL.md
  - config.yaml
  - hindsight/config.json
  - instalar.sh
  - instalar.ps1
  - README.md
