_config_version: 49
model:
  provider: custom
  base_url: https://omniroute.unnichat.com.br/v1
  default: auto/claude-sonnet
  key_env: UNNISEND_OMNIROUTE_KEY
  default_headers:
    x-omniroute-session-id: ${UNNISEND_SESSAO}
custom_providers:
- name: OmniRoute UnniSend
  base_url: https://omniroute.unnichat.com.br/v1
  key_env: UNNISEND_OMNIROUTE_KEY
  model: auto/claude-sonnet
  models:
    auto/claude-sonnet: {}
    auto/claude-opus: {}
    auto/claude-haiku: {}
    auto/smart: {}
    auto/cheap: {}
    auto/best-vision: {}
auxiliary:
  vision:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: auto/best-vision
  compression:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: auto/claude-haiku
  title_generation:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: auto/claude-haiku
    language: pt-BR
agent:
  language: pt-BR
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: hindsight
telemetry:
  shared_metrics:
    enabled: false
    send: false
onboarding:
  seen:
    openclaw_residue_cleanup: true
plugins:
  enabled:
  - hindsight
  - unnisend_atualiza
  - unnisend_agentes
  disabled: []
