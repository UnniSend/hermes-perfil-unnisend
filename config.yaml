_config_version: 49
model:
  provider: custom
  base_url: https://omniroute.unnichat.com.br/v1
  default: unnisend/sonnet
  key_env: UNNISEND_OMNIROUTE_KEY
custom_providers:
- name: OmniRoute UnniSend
  base_url: https://omniroute.unnichat.com.br/v1
  key_env: UNNISEND_OMNIROUTE_KEY
  model: unnisend/sonnet
  models:
    unnisend/sonnet: {}
    unnisend/opus: {}
    unnisend/haiku: {}
    claude/claude-sonnet-5-5: {}
    claude/claude-opus-5-5: {}
    claude/claude-haiku-5-5: {}
    claude/claude-sonnet-5: {}
    claude/claude-opus-5: {}
    claude/claude-sonnet-4-6: {}
    claude/claude-haiku-4-5-20251001: {}
    auto/best-vision: {}
auxiliary:
  vision:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: auto/best-vision
  compression:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: unnisend/haiku
  title_generation:
    provider: custom
    base_url: https://omniroute.unnichat.com.br/v1
    model: unnisend/haiku
    language: pt-BR
agent:
  language: pt-BR
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: hindsight
telemetry:
  shared_metrics:
    enabled: false
    send: false
onboarding:
  seen:
    openclaw_residue_cleanup: true
plugins:
  enabled:
  - hindsight
  - unnisend_atualiza
  - unnisend_agentes
  - unnisend_torriani
  disabled: []
skills:
  # Comandos do kit do Torriani: pasta montada por scripts/torriani.sh (links para as skills do negócio escolhido).
  external_dirs:
  - torriani-skills
terminal:
  # Kit do Torriani (imagem): a chave do OpenRouter viaja da shell que abriu o kit com o nome neutro
  # UNNISEND_IMAGEM_OR (nomes com KEY/TOKEN não atravessam para o gateway) e o shell-init do perfil
  # a traduz para OPENROUTER_API_KEY só dentro dos comandos de terminal da sessão.
  client_env_passthrough:
    - UNNISEND_IMAGEM_OR
  shell_init_files:
    - ~/.hermes/profiles/unnisend/scripts/shell-init.sh
    - ${LOCALAPPDATA}/hermes/profiles/unnisend/scripts/shell-init.sh
    - ~/.profile
    - ~/.bash_profile
    - ~/.bashrc
